# Builds and tests on the three platforms on every push and pull request, packages
# each build, and on a v* tag publishes the packages as a GitHub release.
#
# Public repository: GitHub-hosted runners are free, including macOS and Windows.
# Qt comes from aqtinstall (jurplel/install-qt-action) and is cached per runner.
#
# Everything that could float is pinned: actions to a full commit SHA (tag in the
# comment), Qt to one exact release, linuxdeploy and its Qt plugin to a release tag plus
# sha256. To bump one, change the version and its checksum together.
# Packaging steps are required, and each is followed by a verification step that runs the
# packaged binary and checks SPEC section 5 (binary size) and section 8 (packaging).

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  QT_VERSION: '6.8.3'
  # SPEC section 5: the app binary (Qt not included) must stay at or under 2 MB.
  MAX_BINARY_BYTES: '2097152'
  LINUXDEPLOY_TAG: '1-alpha-20251107-1'
  LINUXDEPLOY_SHA256: 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d'
  LINUXDEPLOY_QT_TAG: '1-alpha-20250213-1'
  LINUXDEPLOY_QT_SHA256: '15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - name: macos
            os: macos-14
            qt_host: mac
            qt_arch: clang_64
          - name: windows
            os: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libfuse2 patchelf

      - name: Configure (Linux / Windows)
        if: matrix.name != 'macos'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS, universal)
        if: matrix.name == 'macos'
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --build-config Release --output-on-failure --output-junit ctest-junit.xml

      # On failure, rerun the failed tests directly with Qt Test's verbose text log written
      # to a file, print it, and keep it as an artifact (some failures show nothing in ctest).
      - name: Diagnose failed tests
        if: failure()
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p test-logs
          cp build/ctest-junit.xml test-logs/ 2>/dev/null || true
          ctest --test-dir build --build-config Release --rerun-failed -V \
            > test-logs/ctest-rerun.txt 2>&1 || true
          cat test-logs/ctest-rerun.txt
          cd build
          for t in $(ctest --build-config Release -N | sed -n 's/^ *Test *#[0-9]*: *//p'); do
            exe="$(find . -type f \( -name "$t.exe" -o -name "$t" \) | head -1)"
            [ -n "$exe" ] || continue
            "$exe" -o "../test-logs/$t.txt,txt" -o -,txt -v2 >/dev/null 2>&1 || {
              echo "=== $t failed on direct run"; cat "../test-logs/$t.txt"; }
          done

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-${{ matrix.name }}
          path: test-logs/*
          if-no-files-found: warn

      # ---------------- packaging (owned by milestone 4) ----------------

      - name: Package (Linux AppImage)
        if: matrix.name == 'linux'
        run: |
          set -eux
          cmake --install build --prefix AppDir/usr
          base=https://github.com/linuxdeploy
          curl -fsSL --retry 3 -o linuxdeploy \
            "$base/linuxdeploy/releases/download/$LINUXDEPLOY_TAG/linuxdeploy-x86_64.AppImage"
          curl -fsSL --retry 3 -o linuxdeploy-plugin-qt \
            "$base/linuxdeploy-plugin-qt/releases/download/$LINUXDEPLOY_QT_TAG/linuxdeploy-plugin-qt-x86_64.AppImage"
          echo "$LINUXDEPLOY_SHA256  linuxdeploy" | sha256sum -c -
          echo "$LINUXDEPLOY_QT_SHA256  linuxdeploy-plugin-qt" | sha256sum -c -
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export PATH="$PWD:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          export OUTPUT="d05-patch-switcher-x86_64.AppImage"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            --desktop-file packaging/d05-patch-switcher.desktop \
            --icon-file assets/icons/d05-patch-switcher.png
          mkdir -p dist && mv "$OUTPUT" dist/

      - name: Verify (Linux AppImage)
        if: matrix.name == 'linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eux
          img="$PWD/dist/d05-patch-switcher-x86_64.AppImage"
          ls -l "$img"
          # --appimage-extract-and-run needs no FUSE.
          "$img" --appimage-extract-and-run --version | tee version.txt
          grep -q "d05-patch-switcher" version.txt
          # The hosted runner usually has no ALSA sequencer. Try to load it; test the real
          # backend only if /dev/snd/seq exists afterwards, else expect FR-15 exit 3.
          sudo modprobe snd-seq || true
          sudo modprobe snd-virmidi || true
          if [ -e /dev/snd/seq ]; then
            "$img" --appimage-extract-and-run --list-ports
          else
            set +e
            "$img" --appimage-extract-and-run --list-ports >ports.txt 2>&1
            rc=$?
            set -e
            cat ports.txt
            test "$rc" -eq 3
            grep -qi "seq" ports.txt
          fi
          # The fake backend exercises the packaged binary end to end without hardware.
          cfg="$(mktemp -d)"
          "$img" --appimage-extract-and-run --fake-midi --config-dir "$cfg" --list-ports | tee fake-ports.txt
          grep -q "Fake D-05 In" fake-ports.txt
          grep -q "Fake D-05 Out" fake-ports.txt
          "$img" --appimage-extract-and-run --fake-midi --config-dir "$cfg" --channel 1 --send P3-45 2>&1 | tee fake-send.txt
          grep -q "C0 1C" fake-send.txt
          # Contents: desktop file, icons at every size, metainfo.
          mkdir verify && cd verify
          "$img" --appimage-extract >/dev/null
          test -f squashfs-root/usr/share/applications/d05-patch-switcher.desktop
          for sz in 16 24 32 48 64 128 256; do
            test -f squashfs-root/usr/share/icons/hicolor/${sz}x${sz}/apps/d05-patch-switcher.png
          done
          test -f squashfs-root/usr/share/metainfo/com.marcastr0.d05_patch_switcher.metainfo.xml
          # Size of the app binary alone (linuxdeploy strips it; Qt is separate files).
          bin=squashfs-root/usr/bin/d05-patch-switcher
          size=$(stat -c %s "$bin")
          echo "app binary: $size bytes (limit $MAX_BINARY_BYTES)"
          test "$size" -le "$MAX_BINARY_BYTES"

      - name: Package (macOS .dmg)
        if: matrix.name == 'macos'
        run: |
          set -eux
          # Stage a copy named for the user ("D-05 Patch Switcher.app") next to an
          # /Applications symlink so the dmg supports drag-install. The executable
          # inside keeps its name, d05-patch-switcher.
          stage="$RUNNER_TEMP/dmg-stage"
          rm -rf "$stage"
          mkdir -p "$stage" dist
          APP="$stage/D-05 Patch Switcher.app"
          cp -R build/d05-patch-switcher.app "$APP"
          macdeployqt "$APP" -always-overwrite
          codesign --force --deep --sign - "$APP"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "D-05 Patch Switcher" -srcfolder "$stage" -ov -format UDZO \
            dist/d05-patch-switcher-macos-universal.dmg

      - name: Verify (macOS .dmg)
        if: matrix.name == 'macos'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eux
          dmg="$PWD/dist/d05-patch-switcher-macos-universal.dmg"
          ls -l "$dmg"
          mnt="$RUNNER_TEMP/d05-dmg"
          mkdir -p "$mnt"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          trap 'hdiutil detach "$mnt" -force || true' EXIT
          app="$mnt/D-05 Patch Switcher.app"
          test -L "$mnt/Applications"
          bin="$app/Contents/MacOS/d05-patch-switcher"
          # Universal: both slices must be present.
          info="$(lipo -info "$bin")"
          echo "$info"
          echo "$info" | grep -q x86_64
          echo "$info" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          # Icon: named by Info.plist and present in Resources; Retina-capable.
          plist="$app/Contents/Info.plist"
          icon="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIconFile' "$plist")"
          echo "CFBundleIconFile: $icon"
          test "$icon" = "d05-patch-switcher.icns"
          test -s "$app/Contents/Resources/$icon"
          hires="$(/usr/libexec/PlistBuddy -c 'Print NSHighResolutionCapable' "$plist")"
          echo "NSHighResolutionCapable: $hires"
          echo "$hires" | grep -qi true
          "$bin" --version | tee version.txt
          grep -q "d05-patch-switcher" version.txt
          "$bin" --list-ports
          # Size: each architecture slice must fit SPEC section 5 (Qt not included).
          echo "universal binary: $(stat -f %z "$bin") bytes"
          for arch in x86_64 arm64; do
            lipo -thin "$arch" "$bin" -output "$RUNNER_TEMP/slice-$arch"
            strip -x "$RUNNER_TEMP/slice-$arch"
            size=$(stat -f %z "$RUNNER_TEMP/slice-$arch")
            echo "$arch slice, stripped: $size bytes (limit $MAX_BINARY_BYTES)"
            test "$size" -le "$MAX_BINARY_BYTES"
          done

      - name: Package (Windows zip)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/d05-patch-switcher | Out-Null
          Copy-Item build/Release/d05-patch-switcher.exe dist/d05-patch-switcher/
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler `
            dist/d05-patch-switcher/d05-patch-switcher.exe
          Compress-Archive -Path dist/d05-patch-switcher/* -DestinationPath dist/d05-patch-switcher-windows-x64.zip

      - name: Verify (Windows zip)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Resolve-Path dist/d05-patch-switcher-windows-x64.zip
          $dir = Join-Path $env:RUNNER_TEMP 'd05-unzipped'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          Expand-Archive -Path $zip -DestinationPath $dir
          $exe = Join-Path $dir 'd05-patch-switcher.exe'
          if (-not (Test-Path $exe)) { throw "exe missing from zip" }
          # The exe is GUI-subsystem. Redirecting stdout/stderr to files gives it usable
          # handles, so main.cpp does not need to attach to a console. Exit codes are
          # read from the process object.
          foreach ($args_ in @('--version', '--list-ports')) {
            $out = Join-Path $env:RUNNER_TEMP ("out" + $args_.TrimStart('-') + ".txt")
            $err = Join-Path $env:RUNNER_TEMP ("err" + $args_.TrimStart('-') + ".txt")
            $p = Start-Process -FilePath $exe -ArgumentList $args_ -WorkingDirectory $dir `
              -Wait -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            Write-Host "== d05-patch-switcher.exe $args_ (exit $($p.ExitCode))"
            Get-Content $out, $err | Write-Host
            if ($p.ExitCode -ne 0) { throw "$args_ exited with $($p.ExitCode)" }
          }
          $ver = Get-Content (Join-Path $env:RUNNER_TEMP 'outversion.txt') -Raw
          if ($ver -notmatch 'd05-patch-switcher') { throw "--version printed nothing useful: '$ver'" }
          # Size of the app exe alone (Qt DLLs are separate files in the zip).
          $size = (Get-Item $exe).Length
          Write-Host "app exe: $size bytes (limit $env:MAX_BINARY_BYTES)"
          if ($size -gt [int64]$env:MAX_BINARY_BYTES) { throw "binary too large" }

      # Artifact names are the matrix names (linux, macos, windows); the release job
      # merges them and publishes dist/*, so the file names above are the release assets.
      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
