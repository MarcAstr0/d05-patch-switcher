# Builds and tests on the three platforms on every push and pull request, packages
# each build, and on a v* tag publishes the packages as a GitHub release.
#
# Public repository: GitHub-hosted runners are free, including macOS and Windows.
# Qt comes from aqtinstall (jurplel/install-qt-action) and is cached per runner.
#
# Milestone 4 of docs/PLAN.md owns making every step here green. Until then, failures
# in the "package" steps are expected; the build-and-test steps must pass from day one.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  QT_VERSION: '6.8.*'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - name: macos
            os: macos-14
            qt_host: mac
            qt_arch: clang_64
          - name: windows
            os: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libfuse2 patchelf

      - name: Configure (Linux / Windows)
        if: matrix.name != 'macos'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS, universal)
        if: matrix.name == 'macos'
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --build-config Release --output-on-failure

      # ---------------- packaging (owned by milestone 4) ----------------

      - name: Package (Linux AppImage)
        if: matrix.name == 'linux'
        run: |
          set -eux
          cmake --install build --prefix AppDir/usr
          curl -sSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          export OUTPUT="d05-patch-switcher-x86_64.AppImage"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            --desktop-file packaging/d05-patch-switcher.desktop \
            --icon-file assets/icons/d05-patch-switcher.png
          mkdir -p dist && mv "$OUTPUT" dist/

      - name: Package (macOS .dmg)
        if: matrix.name == 'macos'
        run: |
          set -eux
          APP=build/d05-patch-switcher.app
          macdeployqt "$APP" -always-overwrite
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          hdiutil create -volname "D-05 Patch Switcher" -srcfolder "$APP" -ov -format UDZO \
            dist/d05-patch-switcher-macos-universal.dmg

      - name: Package (Windows zip)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/d05-patch-switcher | Out-Null
          Copy-Item build/Release/d05-patch-switcher.exe dist/d05-patch-switcher/
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler `
            dist/d05-patch-switcher/d05-patch-switcher.exe
          Compress-Archive -Path dist/d05-patch-switcher/* -DestinationPath dist/d05-patch-switcher-windows-x64.zip

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: ignore

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
